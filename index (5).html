</head><body>
<title>My Journey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2340e8">
<style>
/* Layout: blaues Kopfband mit runden Ecken oben, Inhalt als weiche Karten darunter, schwebendes Dock unten.
   Farben: Spielfeld-Blau (Marke), Sonnen-Orange (Aktionen & Sterne), Sand (Beach). */
:root {
  --bg: #f2f4fa;
  --surface: #ffffff;
  --surface-2: #e8ecf6;
  --line: #d9dfec;
  --fg: #12163a;
  --muted: #646b8c;
  --brand: #2340e8;
  --brand-2: #1a2fbf;
  --on-brand: #ffffff;
  --on-brand-muted: rgb(255 255 255 / .72);
  --accent: #ff6a2b;
  --accent-ink: #ffffff;
  --accent-soft: #ffe9de;
  --indoor: #2340e8;
  --beach: #e39a12;
  --ok: #17a05d; --mid: #e5b100; --warn: #f07d16; --bad: #e0413f;
  --focus-c: #7a4ff0;
  --ch-1: #2340e8; --ch-2: #e8590c;
  --pain-1: #ffc4bd; --pain-2: #f2594b; --pain-3: #9e1018;
  --shadow: 0 1px 2px rgb(18 22 58 / .05), 0 8px 24px rgb(18 22 58 / .07);
  --shadow-lg: 0 10px 30px rgb(18 22 58 / .16);
  --display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 22px;
  --r-sm: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090b1a; --surface: #141834; --surface-2: #1c2147; --line: #283063; --fg: #eef0ff; --muted: #9aa1c8;
    --brand: #2236c9; --brand-2: #192aa3; --on-brand: #ffffff; --on-brand-muted: rgb(255 255 255 / .7);
    --accent: #ff7b3f; --accent-ink: #1a0b03; --accent-soft: #3b2014;
    --indoor: #7088ff; --beach: #f5b83f; --ok: #3ccb7f; --mid: #f1c232; --warn: #ff9a3d; --bad: #ff6461; --focus-c: #a98bff; --ch-1: #6f86ff; --ch-2: #e8661f; --pain-1: #f0a29b; --pain-2: #e5463a; --pain-3: #a3121b;
    --shadow: 0 1px 2px rgb(0 0 0 / .35); --shadow-lg: 0 10px 30px rgb(0 0 0 / .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090b1a; --surface: #141834; --surface-2: #1c2147; --line: #283063; --fg: #eef0ff; --muted: #9aa1c8;
  --brand: #2236c9; --brand-2: #192aa3; --on-brand: #ffffff; --on-brand-muted: rgb(255 255 255 / .7);
  --accent: #ff7b3f; --accent-ink: #1a0b03; --accent-soft: #3b2014;
  --indoor: #7088ff; --beach: #f5b83f; --ok: #3ccb7f; --mid: #f1c232; --warn: #ff9a3d; --bad: #ff6461; --focus-c: #a98bff; --ch-1: #6f86ff; --ch-2: #e8661f; --pain-1: #f0a29b; --pain-2: #e5463a; --pain-3: #a3121b;
  --shadow: 0 1px 2px rgb(0 0 0 / .35); --shadow-lg: 0 10px 30px rgb(0 0 0 / .5); color-scheme: dark;
}

/* ---------- Grundlagen ---------- */
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#root { height: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.block { display: block; }
.pos { color: var(--ok); } .neg { color: var(--bad); }

/* ---------- Shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; max-width: 620px; margin: 0 auto; background: var(--bg); }
@media (min-width: 700px) { .app { box-shadow: 0 0 0 1px var(--line); } }
.app-loading { background: var(--brand); }
.view { flex: 1; min-height: 0; position: relative; }
.screen { height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pad-y { padding-block: 20px 28px; }
.bar { flex-shrink: 0; }

/* Kopfband */
.bar-top { position: relative; z-index: 2; background: var(--brand); color: var(--on-brand); padding-block: 16px 18px; border-radius: 0 0 28px 28px; box-shadow: 0 6px 20px rgb(35 64 232 / .22); overflow: hidden; }
.bar-top::after { content: ""; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .12); box-shadow: 0 0 0 26px rgb(255 255 255 / .04); pointer-events: none; }
.bar-top > .wrap { position: relative; z-index: 1; }
.bar-bottom { padding-block: 12px; background: var(--surface); border-top: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.bar-top .eyebrow { color: var(--on-brand-muted); }
.h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
.h1-xl { font-size: 34px; line-height: 1.05; }
.h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; }

/* Marke */
.brand { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: center; min-width: 0; }
.brand > .brand-ball { grid-row: 1 / span 2; }
.brand > .h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-ball { display: block; width: 46px; height: 46px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px rgb(255 255 255 / .9), 0 4px 12px rgb(0 0 0 / .2); }
.brand-ball-hero { width: 76px; height: 76px; margin-bottom: 10px; box-shadow: 0 0 0 4px var(--surface), var(--shadow-lg); }

/* ---------- Layout-Helfer ---------- */
.stack { display: flex; flex-direction: column; gap: 24px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.stack-sm:empty { display: none; }
.wrap-row { display: flex; flex-wrap: wrap; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid-6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.grid-6 .chip { padding: 0; }
.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.hscroll::-webkit-scrollbar { display: none; }
.action-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- Felder ---------- */
.field { display: flex; flex-direction: column; gap: 10px; }
.field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.label { margin: 0; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hint { font-weight: 600; font-size: 14px; color: var(--muted); }
.hint b { font-family: var(--display); font-size: 18px; color: var(--fg); }
.sub { font-size: 13px; color: var(--muted); }
.sub-lg { color: var(--muted); font-size: 16px; max-width: 36ch; }

.input { width: 100%; border: 2px solid transparent; background: var(--surface); border-radius: var(--r-sm); padding: 13px 14px; font-size: 16px; outline: none; resize: none; box-shadow: var(--shadow); transition: border-color .15s; }
.input::placeholder { color: var(--muted); opacity: .75; }
.input:focus, .input.is-on { border-color: var(--brand); }
.input-num { width: 112px; padding: 10px 12px; }
.inline-field { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }

/* ---------- Chips ---------- */
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: transform .1s, background .15s, color .15s; user-select: none; }
.chip:active { transform: scale(.95); }
.chip.is-on { background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 12px rgb(35 64 232 / .28); }
.chip-big { min-height: 54px; border-radius: 16px; font-family: var(--display); font-size: 17px; font-weight: 600; }
.chip .count { font-family: var(--body); font-size: 13px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px; display: inline-grid; place-items: center; background: rgb(127 127 127 / .18); }
.chip.is-on .count { background: rgb(255 255 255 / .22); }

/* ---------- Sportart-Kacheln ---------- */
.sport-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sport { position: relative; height: 112px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 2px transparent; overflow: hidden; display: flex; align-items: flex-end; padding: 12px 14px; transition: transform .1s, box-shadow .15s; }
.sport:active { transform: scale(.97); }
.sport-court { position: absolute; inset: 14px 14px 42px; border-radius: 4px; background: var(--surface-2); }
.sport-court::before { content: ""; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 3px; margin-left: -1.5px; background: var(--muted); opacity: .5; border-radius: 2px; }
.sport-indoor .sport-court::after { content: ""; position: absolute; inset: 0 33.3%; border-inline: 2px solid rgb(127 127 127 / .3); }
.sport-name { position: relative; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--muted); }
.sport-indoor.is-on { box-shadow: var(--shadow), inset 0 0 0 2.5px var(--indoor); }
.sport-indoor.is-on .sport-court { background: color-mix(in srgb, var(--indoor) 22%, var(--surface)); }
.sport-indoor.is-on .sport-court::before { background: var(--indoor); opacity: 1; }
.sport-indoor.is-on .sport-name { color: var(--indoor); }
.sport-beach.is-on { box-shadow: var(--shadow), inset 0 0 0 2.5px var(--beach); }
.sport-beach.is-on .sport-court { background: color-mix(in srgb, var(--beach) 28%, var(--surface)); }
.sport-beach.is-on .sport-court::before { background: var(--beach); opacity: 1; }
.sport-beach.is-on .sport-name { color: var(--beach); }
.sport-note { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 7px 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: 14px; }
.sport-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--indoor); }
.sport-note-beach .sport-dot { background: var(--beach); }

/* ---------- Tags ---------- */
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 2px solid transparent; background: var(--surface); border-radius: var(--r-sm); padding: 6px; box-shadow: var(--shadow); }
.tags:focus-within { border-color: var(--brand); }
.tags input { flex: 1; min-width: 8rem; border: 0; outline: none; background: transparent; padding: 7px 8px; font-size: 16px; }
.tags input::placeholder { color: var(--muted); opacity: .75; }
.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--brand); color: var(--on-brand); border-radius: 999px; padding: 6px 6px 6px 12px; font-weight: 600; font-size: 14px; }
.tag button { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgb(255 255 255 / .18); }
.suggest { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; color: var(--muted); }

/* ---------- RPE ---------- */
.rpe { --tone: var(--mid); padding: 14px 14px 10px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.rpe.tone-ok { --tone: var(--ok); } .rpe.tone-warn { --tone: var(--warn); } .rpe.tone-bad { --tone: var(--bad); }
.rpe input { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; margin: 0; }
.rpe input::-webkit-slider-runnable-track { height: 14px; border-radius: 99px; background: linear-gradient(to right, var(--tone) var(--pct), var(--surface-2) var(--pct)); }
.rpe input::-moz-range-track { height: 14px; border-radius: 99px; background: var(--surface-2); }
.rpe input::-moz-range-progress { height: 14px; border-radius: 99px; background: var(--tone); }
.rpe input::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -10px; border-radius: 50%; background: var(--surface); border: 6px solid var(--tone); box-shadow: var(--shadow-lg); }
.rpe input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 6px solid var(--tone); }
.rpe-ticks { display: flex; justify-content: space-between; padding: 2px 10px 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rpe-ticks span { width: 14px; text-align: center; }
.rpe-ticks .is-on { color: var(--fg); font-weight: 800; }

/* ---------- Icon-Skala ---------- */
.iscale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.iscale-btn { height: 52px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--line); transition: transform .1s, background .15s; }
.iscale-btn:active { transform: scale(.9); }
.iscale-btn.is-on { color: var(--accent); background: var(--accent-soft); box-shadow: none; }
.iscale-btn.tone-focus.is-on { color: var(--focus-c); background: color-mix(in srgb, var(--focus-c) 14%, var(--surface)); }
.sub + .iscale, p.sub { margin-bottom: 2px; }

/* ---------- Beschwerden ---------- */
.complaint { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-sm); padding: 6px 6px 6px 14px; font-weight: 600; font-size: 15px; flex-wrap: wrap; }
.intensity { display: flex; gap: 4px; }
.int-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-weight: 800; }
.int-btn.lv-mid { background: var(--mid); color: #1b1500; }
.int-btn.lv-warn { background: var(--warn); color: #fff; }
.int-btn.lv-bad { background: var(--bad); color: #fff; }

/* ---------- Sterne ---------- */
.ratings { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px 0; }
.rating-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 6px 2px 16px; font-weight: 600; font-size: 15px; }
.rating-row + .rating-row { border-top: 1px solid var(--surface-2); }
.stars { display: flex; }
.star { width: 38px; height: 44px; display: grid; place-items: center; color: var(--line); transition: transform .1s; }
.star:active { transform: scale(.82); }
.star.is-on { color: var(--accent); }

/* ---------- Satz-Anzeige (Check-in) ---------- */
.sets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.set { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 12px; background: rgb(255 255 255 / .12); color: var(--on-brand-muted); text-align: left; min-width: 0; }
.set-num { flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 12px; background: rgb(255 255 255 / .16); }
.set-name { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set.is-done { color: var(--on-brand); }
.set.is-done .set-num { background: var(--on-brand); color: var(--brand); }
.set.is-now { background: var(--on-brand); color: var(--brand); }
.set.is-now .set-num { background: var(--accent); color: #fff; }
@media (max-width: 360px) { .set-name { display: none; } .set { justify-content: center; } }

.ghost-btn { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: rgb(255 255 255 / .14); color: var(--on-brand); font-weight: 700; font-size: 14px; }
.ghost-btn.is-armed { background: var(--bad); color: #fff; }
.alert { margin: 0 0 18px; padding: 12px 14px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); font-weight: 600; font-size: 14px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bad) 45%, transparent); }
.alert-flat { margin: 0; }
.success { padding: 12px 14px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--ok) 13%, var(--surface)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ok) 45%, transparent); font-size: 15px; font-weight: 500; }

/* ---------- Buttons ---------- */
.btn-primary { flex: 1; min-height: 56px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 38%, transparent); transition: transform .1s; }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .5; box-shadow: none; }
.btn-sm { flex: none; min-height: 44px; font-size: 14px; padding: 0 16px; border-radius: 14px; }
.btn-fit { flex: none; min-height: 50px; padding: 0 20px; border-radius: 16px; }
.btn-outline { min-height: 48px; padding: 0 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn-outline:disabled { opacity: .45; cursor: default; }
.btn-block { justify-content: center; width: 100%; }
.bar-bottom .btn-outline { min-height: 56px; border-radius: 18px; }
.btn-square { width: 56px; height: 56px; flex-shrink: 0; border-radius: 18px; background: var(--surface-2); display: grid; place-items: center; }
.bar-bottom .action-row { flex-wrap: nowrap; }

/* ---------- Hinweise ---------- */
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: var(--r); background: var(--accent-soft); font-size: 15px; }
.callout > svg { flex-shrink: 0; margin-top: 2px; color: var(--accent); }
.callout-k { font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.callout-warn { background: var(--surface); box-shadow: var(--shadow); }
.callout-warn > svg { color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 999px; background: rgb(255 255 255 / .16); color: var(--on-brand); font-size: 13px; font-weight: 700; flex-shrink: 0; }
.example-banner { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); font-size: 15px; border-left: 5px solid var(--accent); }
.example-banner .btn-primary { align-self: flex-start; }
.empty { padding: 20px; text-align: center; color: var(--muted); font-size: 14px; border-radius: var(--r); background: var(--surface-2); }

/* ---------- Kennzahlen & Karten ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats.stats-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 14px 6px 12px; text-align: center; min-width: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.stat:first-child { background: var(--fg); color: var(--bg); }
.stat:first-child .stat-s { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.stat-v { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; }
.stat-k { font-size: 12px; font-weight: 700; margin-top: 6px; }
.stat-s { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.big-num { font-family: var(--display); font-weight: 700; font-size: 22px; }
.big-num small { font-family: var(--body); font-size: 13px; color: var(--muted); font-weight: 700; }

/* Chart */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 5; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--body); font-weight: 600; }
.chart .axis-now { fill: var(--fg); font-weight: 800; }
.bar-ok { fill: var(--ok); background: var(--ok); } .bar-mid { fill: var(--mid); background: var(--mid); }
.bar-warn { fill: var(--warn); background: var(--warn); } .bar-bad { fill: var(--bad); background: var(--bad); }
.bar-empty { fill: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend-note { margin-left: auto; }

/* ---------- Historie ---------- */
.entry { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.entry-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; text-align: left; }
.entry-badge { flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; }
.entry-indoor .entry-badge { background: color-mix(in srgb, var(--indoor) 16%, var(--surface)); color: var(--indoor); }
.entry-beach .entry-badge { background: color-mix(in srgb, var(--beach) 20%, var(--surface)); color: var(--beach); }
.entry-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.entry-date { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.entry-title { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.entry-meta span { display: inline-flex; align-items: center; gap: 4px; }
.chev { flex-shrink: 0; color: var(--muted); transition: transform .2s; }
.chev.is-open { transform: rotate(180deg); }
.entry-body { border-top: 1px solid var(--surface-2); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; }
.row-k { font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row-v { white-space: pre-wrap; overflow-wrap: anywhere; }
.rating-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
.rating-grid div { display: flex; justify-content: space-between; gap: 8px; }
.rating-grid span { color: var(--muted); }
.rating-grid b { display: inline-flex; align-items: center; gap: 2px; }
.rating-grid svg { color: var(--accent); }
.confirm { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 12px; color: var(--bad); font-weight: 700; font-size: 14px; }
.confirm.is-armed { background: var(--bad); color: #fff; }
.backup, .account { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 16px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.account-mail { font-weight: 700; overflow-wrap: anywhere; }

/* ---------- Ziele ---------- */
.goal-form { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--surface-2); border-radius: var(--r); }
.goal-form .input { box-shadow: none; }
.date-pill { flex: 1; min-width: 0; min-height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface); border-radius: var(--r-sm); color: var(--muted); font-size: 14px; font-weight: 600; }
.date-pill input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--fg); font-size: 16px; }
.goal { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px 4px 4px 2px; }
.goal-check { width: 50px; height: 50px; flex-shrink: 0; display: grid; place-items: center; }
.goal-check:disabled { cursor: default; }
.tick { width: 28px; height: 28px; border-radius: 9px; border: 2.5px solid var(--line); display: grid; place-items: center; }
.goal.is-done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.goal.is-done .goal-title { text-decoration: line-through; color: var(--muted); }
.goal-main { flex: 1; min-width: 0; padding-block: 10px; }
.goal-title { font-weight: 700; overflow-wrap: anywhere; }
.goal-date { font-size: 13px; color: var(--muted); font-weight: 600; }
.goal-date.neg { color: var(--bad); }
.goal .confirm { align-self: center; }
.disclose { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-height: 40px; }

/* ---------- Profil ---------- */
.profile-card { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.avatar { flex-shrink: 0; width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 22px; color: #fff; background: var(--indoor); }
.avatar-beach { background: var(--beach); color: #1a1000; }
.profile-meta { min-width: 0; }
.profile-name { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; overflow-wrap: anywhere; }
.week-strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; height: 116px; margin-block: 8px 6px; }
.week-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.week-bar { position: relative; flex: 1; width: 100%; max-width: 30px; border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.week-bar > span { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 10px; background: color-mix(in srgb, var(--brand) 45%, var(--surface-2)); }
.week-bar > span.is-now { background: var(--brand); }
.week-bar > span.is-hit { background: var(--ok); }
.week-target { position: absolute; left: -2px; right: -2px; height: 0; border-top: 2px dashed var(--fg); opacity: .4; z-index: 1; }
.week-n { font-size: 12px; color: var(--muted); font-weight: 600; }
.week-n.is-now { color: var(--fg); font-weight: 800; }

/* ---------- Anmeldung & Einstieg ---------- */
.onboard { display: flex; flex-direction: column; gap: 24px; padding-block: 0 32px; }
.onboard-hero { display: flex; flex-direction: column; gap: 8px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 32px max(16px, env(safe-area-inset-right, 0px)) 30px max(16px, env(safe-area-inset-left, 0px)); background: var(--brand); color: var(--on-brand); border-radius: 0 0 32px 32px; position: relative; overflow: hidden; }
.onboard-hero::after { content: ""; position: absolute; right: -80px; bottom: -110px; width: 260px; height: 260px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .14); box-shadow: 0 0 0 32px rgb(255 255 255 / .05); pointer-events: none; }
.onboard-hero .eyebrow { color: var(--on-brand-muted); }
.onboard-hero .sub-lg { color: var(--on-brand-muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 5px; gap: 5px; border-radius: 18px; background: var(--surface-2); }
.seg-btn { min-height: 46px; border-radius: 14px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); }
.seg-btn.is-on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.pw { position: relative; }
.pw .input { padding-right: 104px; }
.pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); min-height: 36px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.auth-links { margin-top: -10px; }
.link { color: var(--brand); font-weight: 700; font-size: 14px; min-height: 36px; }

/* ---------- Dock (Navigation) ---------- */
.tabbar { flex-shrink: 0; background: var(--bg); padding: 6px max(12px, env(safe-area-inset-left, 0px)) 10px max(12px, env(safe-area-inset-right, 0px)); }
.tabbar .wrap { padding: 0; }
.tabbar-row { display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; padding: 6px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-lg); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; border-radius: 18px; color: var(--muted); font-size: 11px; font-weight: 700; transition: background .15s, color .15s; }
.tab.is-on { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--surface)); }
.tab-new-icon { position: relative; width: 44px; height: 32px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform .1s; }
.tab-new:active .tab-new-icon { transform: scale(.9); }
.tab-new.is-on { background: var(--accent-soft); color: var(--fg); }
.pip { position: absolute; top: -4px; right: -4px; width: 13px; height: 13px; border-radius: 50%; background: var(--bad); border: 2.5px solid var(--surface); }
.tab-avatar { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); font-family: var(--display); font-weight: 700; font-size: 11px; }
.tab.is-on .tab-avatar { background: var(--brand); color: var(--on-brand); }

/* ---------- Toast ---------- */
.toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 15px; box-shadow: var(--shadow-lg); animation: pop .25s ease-out; z-index: 20; }
@keyframes pop { from { transform: translate(-50%, 8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.footer-alert { margin-bottom: 10px; }

/* Ziele-Abschnitt in der Übersicht */
.goals-section { padding-top: 22px; border-top: 2px solid var(--surface-2); scroll-margin-top: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.link-goals { display: inline-block; margin-top: 4px; text-align: left; }

/* Trainingsart: drei Kacheln */
.type-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.type-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 12px 12px; min-height: 128px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); text-align: left; transition: transform .1s, background .15s, color .15s; }
.type-tile:active { transform: scale(.96); }
.type-icon { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand); }
.type-label { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.15; overflow-wrap: anywhere; }
.type-desc { font-size: 12px; line-height: 1.3; color: var(--muted); }
.type-tile.is-on { background: var(--brand); color: var(--on-brand); box-shadow: 0 6px 18px rgb(35 64 232 / .3); }
.type-tile.is-on .type-icon { background: rgb(255 255 255 / .18); color: var(--on-brand); }
.type-tile.is-on .type-desc { color: var(--on-brand-muted); }
@media (max-width: 370px) { .type-label { font-size: 13px; } .type-desc { display: none; } .type-tile { min-height: 96px; } }

/* Eigene Trainingsarten */
.custom-types { display: flex; flex-direction: column; gap: 10px; }
.chip-add { background: transparent; box-shadow: none; border: 1.5px dashed color-mix(in srgb, var(--brand) 55%, var(--line)); color: var(--brand); }
.custom-add { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r); background: var(--surface-2); }
.custom-add .input { box-shadow: none; }

/* Körperkarte: dunkle Karte mit heller Linien-Anatomie (in beiden Themes) */
.bodymap { --bm-bg: #10131f; --bm-line: #e9ecf5; --bm-muted: rgb(233 236 245 / .62);
  display: flex; flex-direction: column; gap: 12px; padding: 16px 14px 14px; border-radius: var(--r); background: var(--bm-bg); color: var(--bm-line); box-shadow: var(--shadow-lg); }
.bodymap-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.bodymap-title { font-family: var(--display); font-weight: 700; font-size: 16px; }
.seg-dark { background: rgb(255 255 255 / .08); padding: 4px; gap: 4px; border-radius: 14px; }
.seg-dark .seg-btn { min-height: 36px; padding: 0 14px; font-size: 13px; color: var(--bm-muted); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg-dark .seg-btn.is-on { background: var(--bm-line); color: var(--bm-bg); box-shadow: none; }
.seg-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pain-2); color: #fff; font-family: var(--body); font-size: 11px; font-weight: 800; display: inline-grid; place-items: center; }
.pain-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; font-weight: 600; color: var(--bm-line); }
.pain-legend span { display: inline-flex; align-items: center; gap: 6px; }
.pain-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.pain-dot.lv1 { background: #ffb3ab; } .pain-dot.lv2 { background: #ef4b3e; } .pain-dot.lv3 { background: #a3121b; box-shadow: 0 0 0 1px rgb(255 255 255 / .35); }
.body-svg { height: 320px; width: auto; max-width: 100%; display: block; margin: 0 auto; touch-action: manipulation; }
.body-side { font-size: 14px; }
.body-outline { fill: none; stroke: rgb(233 236 245 / .55); stroke-width: 1; pointer-events: none; }
.body-detail { fill: none; stroke: rgb(255 255 255 / .2); stroke-width: 1; stroke-linecap: round; pointer-events: none; }
.body-side { fill: var(--bm-muted); font-size: 12px; font-weight: 800; font-family: var(--body); }
.zone { fill: rgb(255 255 255 / .001); stroke: none; cursor: pointer; transition: fill .15s; -webkit-tap-highlight-color: transparent; }
.zone:hover { fill: rgb(255 255 255 / .08); }
.zone:focus-visible { outline: none; fill: rgb(255 255 255 / .12); stroke: var(--accent); stroke-width: 1.5; }
.bodymap-hint { text-align: center; font-size: 12px; color: var(--bm-muted); }
.pain-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 12px; border-top: 1px solid rgb(255 255 255 / .1); }
.pain-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: rgb(255 255 255 / .09); color: var(--bm-line); font-size: 13px; font-weight: 700; }
.link-light { color: var(--bm-line); text-decoration: underline; text-underline-offset: 3px; }

/* Element herausnehmen */
.rating-row { padding-right: 4px; }
.rating-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rating-skip { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.rating-skip:hover { background: var(--surface-2); color: var(--bad); }
.skipped { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 370px) { .star { width: 32px; } }

/* Fokus-Nachricht */
.focus-msg-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.focus-msg { width: 100%; display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--r);
  background: color-mix(in srgb, var(--accent) 82%, #000); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
.focus-msg-icon { flex-shrink: 0; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: rgb(255 255 255 / .2); }
.focus-msg-body { min-width: 0; }
.focus-msg-k { font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgb(255 255 255 / .82); }
.focus-msg-text { margin-top: 4px; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
.focus-msg-from { margin-top: 6px; font-size: 13px; font-weight: 600; color: rgb(255 255 255 / .82); }
.focus-msg-empty .focus-msg-text { font-size: 17px; }
.focus-msg-btn { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 12px; background: #fff; color: var(--accent); font-weight: 800; font-size: 14px; }
:root[data-theme="dark"] .focus-msg { color: #1a0b03; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .focus-msg { color: #1a0b03; } }
:root[data-theme="dark"] .focus-msg-k, :root[data-theme="dark"] .focus-msg-from { color: rgb(26 11 3 / .75); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .focus-msg-k, :root:not([data-theme="light"]) .focus-msg-from { color: rgb(26 11 3 / .75); } }
:root[data-theme="dark"] .focus-msg-icon { background: rgb(0 0 0 / .12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .focus-msg-icon { background: rgb(0 0 0 / .12); } }

/* Kompaktes Belastungsdiagramm */
.card-compact { padding: 12px 14px; }
.chart-compact .card-head { margin-bottom: 4px; }
.chart-compact .chart { max-height: 92px; }
.chart-compact .axis { font-size: 9px; }
.mini-num { font-weight: 700; font-size: 13px; color: var(--muted); }
.legend-sm { margin-top: 6px; font-size: 11px; gap: 2px 10px; }
.legend-sm .dot { width: 8px; height: 8px; }

/* Kalender / Nächstes Training */
.next-card .card-head { margin-bottom: 6px; }
.next-row { display: flex; align-items: center; gap: 12px; }
.next-icon { flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 12%, var(--surface)); color: var(--brand); }
.next-main { flex: 1; min-width: 0; }
.next-when { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.25; }
.cal-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.cal-buttons a { text-decoration: none; color: inherit; }
.cal-buttons .cal-main { color: var(--accent-ink); }
.cal-alt { min-height: 40px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.plan-form { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r); background: var(--surface-2); }
.plan-form .input { box-shadow: none; padding: 11px 12px; }
.plan-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plan-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
.plan-check { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; min-height: 40px; cursor: pointer; }
.plan-check input { width: 22px; height: 22px; accent-color: var(--brand); }

/* Kompakte Kennzahlen */
.stats-mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 4px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.stats-mini .stat { padding: 8px 4px; background: transparent; box-shadow: none; border-radius: 14px; }
.stats-mini .stat + .stat { border-left: 1px solid var(--surface-2); border-radius: 0; }
.stats-mini .stat:first-child { background: transparent; color: inherit; }
.stats-mini .stat:first-child .stat-s { color: var(--muted); }
.stats-mini .stat-v { font-size: 17px; }
.stats-mini .stat-k { font-size: 11px; margin-top: 3px; }
.stats-mini .stat-s { font-size: 10px; }

/* Monatskalender */
.cal-card { padding: 14px 12px 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cal-title-wrap { text-align: center; min-width: 0; }
.cal-title { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; }
